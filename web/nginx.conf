# Internal nginx for the `web` container: serves the built SPA and falls back
# to index.html for client-side routes. It does NOT terminate TLS or proxy the
# API - that's the job of the top-level `nginx` reverse-proxy container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
