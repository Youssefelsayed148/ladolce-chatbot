# Internal nginx for the `web` container: serves the built SPA and falls back
# to index.html for client-side routes. It does NOT terminate TLS or proxy the
# API - that's the job of the top-level `nginx` reverse-proxy container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The embeddable widget keeps a stable URL (customers paste one script tag),
    # so it is revalidated rather than cached for long.
    location = /widget.js {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
