# Whole stack, one command:   docker compose up -d --build
#
#   caddy (public :80/:443, automatic HTTPS)  ->  web (SPA + widget.js)   :80
#                                             ->  api (FastAPI)           :8000
#   api                                       ->  db  (Postgres+pgvector) :5432
#
# Copy .env.example to .env and fill in the values first (see docs/deploy.md).
# On start the api container migrates the DB, seeds the catalog the first time,
# syncs it from the store and ingests the knowledge base (see api/entrypoint.sh).

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: only the api container can reach the database.

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # All settings (DATABASE_URL, keys, CORS, ...) come from env_file, which reads the
    # literal .env file, so nothing exported in the host shell can shadow it.
    env_file:
      - .env
    volumes:
      - ./db:/db:ro        # Alembic migrations
      - ./data:/data:ro    # catalog + knowledge-base sources
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s   # first start seeds the catalog and embeds the KB
    expose:
      - "8000"

  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # issued certificates
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

volumes:
  db_data:
  caddy_data:
  caddy_config:
