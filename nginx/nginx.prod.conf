# Production variant of nginx.conf: HTTPS + HTTP->HTTPS redirect.
# Use by mounting this file instead of nginx.conf in docker-compose (see
# docs/deploy.md). Replace YOUR_DOMAIN with the real domain (e.g. chat.example.com).

limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;

upstream api_upstream { server api:8000; }
upstream web_upstream { server web:80; }

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        limit_req zone=chat_limit burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so clients cannot spoof their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
