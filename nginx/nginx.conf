# Public-facing reverse proxy for the whole stack.
#
#   /api/*  -> FastAPI backend (api:8000)
#   /*      -> React SPA served by the web container (web:80)
#
# TLS is a placeholder here: on the VPS, Let's Encrypt (certbot) provisions real
# certificates and the commented 443 server block below is enabled, pointing at
# the issued cert/key. Locally we only serve plain HTTP on port 80.

# Basic per-IP rate limiting zone for the chat endpoint (belt-and-suspenders
# alongside the app-level slowapi limit). 10 requests/sec sustained, small burst.
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;

upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # --- API ---
    location /api/ {
        limit_req zone=chat_limit burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so a client-supplied X-Forwarded-For cannot
        # spoof the IP the API rate-limits on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (streaming /api/chat) needs buffering off and a
        # long read timeout so tokens flush as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # --- Frontend SPA ---
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so a client-supplied X-Forwarded-For cannot
        # spoof the IP the API rate-limits on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

